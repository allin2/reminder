name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 提醒时间逻辑对时区敏感：本地开发时区 + UTC 各跑一遍
        tz: [Asia/Shanghai, UTC]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 测试只用 Node 内置模块，不需要 npm ci
      - run: npm test

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run cap:sync
      - name: Build debug APK and run JVM tests
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
