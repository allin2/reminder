name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 提醒时间逻辑对时区敏感：本地开发时区 + UTC 各跑一遍
        tz: [Asia/Shanghai, UTC]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 测试只用 Node 内置模块，不需要 npm ci
      - run: npm test
